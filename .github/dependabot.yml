version: 2
updates:
  # release.yml pins its actions to commit SHAs so a moved upstream tag cannot
  # replace code able to publish the package. Dependabot keeps the pins
  # current, updating the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # openapi-typescript drives the TypeScript compiler API, which TypeScript 7
      # (the Go port) no longer exposes; `pnpm generate` fails on it. Bump the
      # major by hand once openapi-typescript supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the minimum supported runtime (engines.node), not
      # the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
