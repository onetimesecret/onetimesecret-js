name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run check:package
      - run: pnpm run release:check
      - name: Generated types are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated is stale. Run 'pnpm generate' and commit the result." >&2
            exit 1
          }

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  runtimes:
    name: Smoke test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - name: Import the built package
        run: |
          cat > /tmp/smoke.mjs <<'JS'
          import { OnetimeSecret, ConfigurationError } from "./dist/index.js";
          const client = new OnetimeSecret({ baseUrl: "https://eu.onetimesecret.com" });
          if (client.authenticated) throw new Error("expected anonymous client");
          try { new OnetimeSecret({ baseUrl: "https://onetimesecret.com" }); throw new Error("apex accepted"); }
          catch (e) { if (!(e instanceof ConfigurationError)) throw e; }
          console.log("ok");
          JS
          cp /tmp/smoke.mjs ./smoke.mjs
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun ./smoke.mjs; else deno run --allow-env ./smoke.mjs; fi
