name: Release

# Tag-driven release, following the pattern used across the Onetime Secret
# SDKs (onetimesecret-py, onetimesecret-rust, onetimesecret-ruby):
#
#   pnpm bump X.Y.Z && git commit -am "Release X.Y.Z"
#   git tag -a vX.Y.Z -m vX.Y.Z && git push origin main vX.Y.Z
#
#   build   -> verify tag == package.json version, run checks, pack the tarball
#   publish -> npm publish via Trusted Publishing (OIDC); no token stored
#   github  -> create the GitHub Release with the CHANGELOG section as notes
#
# Actions are pinned to commit SHAs so a moved upstream tag cannot replace
# code able to publish the package. Dependabot keeps the pins current.
# Setup and the release checklist are in docs/releasing.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
          pnpm run release:check

      - name: Run checks
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run build
          pnpm run test
          pnpm run check:package

      - name: Pack
        run: |
          mkdir -p artifacts
          pnpm pack --out artifacts/package.tgz
          tar -tzf artifacts/package.tgz

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > artifacts/notes.md
          if [ ! -s artifacts/notes.md ]; then
            echo "::error::No CHANGELOG.md section for $version" >&2
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@onetimesecret/sdk
    permissions:
      id-token: write # mint the OIDC token npm verifies
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # no checkout in this job, so .node-version is not available
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm may lag.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts/

      - name: Publish
        # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
        # short-lived credential, and attaches provenance automatically.
        # Prereleases (v1.0.0-rc.1) go to the "next" dist-tag so plain
        # `npm install @onetimesecret/sdk` stays on stable.
        env:
          NPM_CONFIG_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
        run: npm publish artifacts/package.tgz --access public

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the tarball
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts/

      - name: Create GitHub Release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          mv artifacts/package.tgz "artifacts/onetimesecret-sdk-${TAG_NAME#v}.tgz"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading the tarball only"
            gh release upload "$TAG_NAME" artifacts/*.tgz --clobber
          else
            flags=()
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$TAG_NAME" artifacts/*.tgz \
              --title "@onetimesecret/sdk ${TAG_NAME#v}" \
              --notes-file artifacts/notes.md \
              --verify-tag "${flags[@]}"
          fi
